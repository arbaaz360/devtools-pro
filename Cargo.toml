[workspace]
resolver = "2"
members = ["crates/devtools-core", "crates/devtools-cli", "apps/desktop/src-tauri", "packages/plugin-contract"]
default-members = ["crates/devtools-core", "crates/devtools-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
sha2 = "0.10"
regex = "1"
