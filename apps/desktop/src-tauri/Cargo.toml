[package]
name = "devtools-desktop"
version = "0.1.0"
edition = "2024"
description = "Native workbench shell with bounded file previews and cancellable Rust workers"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
devtools-core = { path = "../../../crates/devtools-core" }
serde.workspace = true
serde_json.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
