[package]
name = "devtools-desktop"
version = "0.1.0"
edition = "2024"
description = "Native workbench shell with bounded file previews and cancellable Rust workers"

[build-dependencies]
tauri-build = { version = "2", features = [] }
devtools-plugin-discovery = { path = "../../../packages/plugin-discovery" }
serde.workspace = true
serde_json.workspace = true

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
devtools-core = { path = "../../../crates/devtools-core" }
devtools-plugin-contract = { path = "../../../packages/plugin-contract" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
thiserror.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
# Compiles in the two hooks the release smoke needs to reach a release window: a
# debugging port (DEVTOOLS_SMOKE_BROWSER_ARGS) and its own profile (DEVTOOLS_TEST_PROFILE).
# Built only by the gate's release-smoke job; `tauri build` never enables it, so a
# shipped installer has neither. See docs/QUALITY_CHECKS.md.
smoke-hooks = []
