[package]
name = "devtools-desktop"
version = "0.1.0"
edition = "2024"
description = "Native workbench shell with bounded file previews and cancellable Rust workers"

[build-dependencies]
tauri-build = { version = "2", features = [] }
devtools-plugin-discovery = { path = "../../../packages/plugin-discovery" }
serde.workspace = true
serde_json.workspace = true

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
devtools-core = { path = "../../../crates/devtools-core" }
devtools-plugin-contract = { path = "../../../packages/plugin-contract" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
thiserror.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
